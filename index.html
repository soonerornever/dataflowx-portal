<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>DataFlowX Portal</title>
    <meta http-equiv="refresh" content="0; url=https://script.google.com/macros/s/AKfycbxJDAtlAV3JyBo0-FsuynupcBbNXWPhznwFq8W2aXLvL1hYnW7b9OIuEbV1bQ-mBBHl/exec">
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
        }
        .redirect-box {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            max-width: 400px;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #e2e8f0;
            border-top-color: #1a3c5e;
            border-radius: 50%;
            margin: 0 auto 20px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h2 {
            color: #1a3c5e;
            margin-bottom: 10px;
        }
        p {
            color: #64748b;
            margin-bottom: 20px;
        }
        a {
            display: inline-block;
            background: #1a3c5e;
            color: white;
            padding: 10px 24px;
            text-decoration: none;
            border-radius: 8px;
            margin-top: 15px;
        }
        a:hover {
            background: #2c5a7a;
        }
    </style>
</head>
<body>
    <div class="redirect-box">
        <div class="spinner"></div>
        <h2>📡 DataFlowX Portal</h2>
        <p>Uygulamaya yönlendiriliyorsunuz...</p>
        <p><small>Otomatik yönlendirme çalışmazsa butona tıklayın</small></p>
        <a href="https://script.google.com/macros/s/AKfycbxJDAtlAV3JyBo0-FsuynupcBbNXWPhznwFq8W2aXLvL1hYnW7b9OIuEbV1bQ-mBBHl/exec">🚀 Uygulamaya Git</a>
    </div>
</body>
</html>
